<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow ERP &bull; Enterprise Sign In</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <div style="width: 44px; height: 44px; margin: 0 auto 12px; background: linear-gradient(135deg, #2563eb, #6366f1); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <h1 style="font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em;">TaskFlow ERP</h1>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Employee Task Management System</p>
    </div>

    <!-- Role Switcher Tabs -->
    <div class="role-switcher-tabs">
      <button type="button" class="role-tab-btn active" data-role="admin">
        🛡️ Administrator
      </button>
      <button type="button" class="role-tab-btn" data-role="employee">
        👤 Team Member
      </button>
    </div>

    <form id="loginForm">
      <input type="hidden" id="selectedRole" value="admin">

      <div class="form-group">
        <label class="form-label" for="loginEmail">Work Email</label>
        <input type="email" id="loginEmail" class="form-control" value="admin@corp.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Master Password</label>
        <input type="password" id="loginPassword" class="form-control" value="••••••••" required autocomplete="current-password">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; font-size: 0.82rem;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-muted);">
          <input type="checkbox" checked>
          <span>Keep session active</span>
        </label>
        <a href="#" style="color: var(--primary); font-weight: 600;" onclick="showToast('Password reset link sent to demo email', 'info'); return false;">Forgot access?</a>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px;">
        Sign In to Workspace
      </button>

      <div style="margin-top: 20px; padding: 12px; background: #f8fafc; border: 1px dashed var(--border-color); border-radius: var(--radius-sm); font-size: 0.78rem; color: var(--text-muted);">
        <strong style="color: var(--text-main);">Demo Accounts Preloaded:</strong>
        <div style="margin-top: 4px;">&bull; <strong>Admin:</strong> admin@corp.com (Full Control)</div>
        <div>&bull; <strong>Employee:</strong> emily.miller@corp.com (Assigned View)</div>
      </div>
    </form>
  </div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
